# Every PRD 15 gate on every push (spec 02, S02-13).
# e2e-tier1 is spec 19's; the preview smoke set runs from preview-smoke.yml. deploy-production runs
# after all-green on main (02 S02-22).
name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/foundry
        with:
          version: ${{ steps.versions.outputs.FOUNDRY }}
      - run: npm ci
      - run: npm run build -w @amplop/shared
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run lint:sol
      - run: npm run fmt:sol:check
      - run: npm run check:repo
      - run: npm run check:skills
      - run: npm run generate
      - run: git diff --exit-code

  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check every commit message in the push range
        env:
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          from="${BASE:-$BEFORE}"
          if [ -z "$from" ] || [ "$from" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$from" 2>/dev/null; then
            range="$HEAD_SHA"
          else
            range="$from..$HEAD_SHA"
          fi
          bad=0
          for sha in $(git rev-list "$range"); do
            git log -1 --format=%B "$sha" > /tmp/msg
            node scripts/check-commit-msg.mjs /tmp/msg || { echo "  in $sha"; bad=1; }
          done
          exit $bad

  test-ts:
    runs-on: ubuntu-24.04
    services:
      # Same image as apps/web/docker-compose.yml and POSTGRES_IMAGE_DIGEST in tools/versions.env.
      db:
        image: postgres:16@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: amplop
          POSTGRES_PASSWORD: amplop
          POSTGRES_DB: amplop
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U amplop -d amplop" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/foundry
        with:
          version: ${{ steps.versions.outputs.FOUNDRY }}
      - run: npm ci
      - run: npm run build -w @amplop/shared
      - name: Database roles (05 S05-36)
        run: psql "postgres://amplop:amplop@127.0.0.1:5432/amplop" -v ON_ERROR_STOP=1 -v migrator_pw=amplop_migrator -v app_pw=amplop_app -f apps/web/drizzle/roles.sql
      - run: cd contracts && forge build
      - run: npm run test:coverage
      - name: Case map (19 S19-16)
        run: npm run e2e:check-map -w @amplop/web

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Build with the canary values, then scan the browser bundle (S02-20, S05-54)
        run: |
          set -a
          . ./.env.example
          set +a
          npm run build
          npm run scan:bundle
      - name: Lighthouse budget for the landing page (17 S17-16)
        run: |
          set -a
          . ./.env.example
          set +a
          npm run lhci -w @amplop/web
      - name: Demo-off build has no demo controls (15 S15-15)
        run: |
          set -a
          . ./.env.example
          set +a
          export NEXT_PUBLIC_DEMO_MODE=false DEMO_MODE=false
          npm run build -w @amplop/web
          npm run check:demo-off -w @amplop/web

  test-contracts:
    runs-on: ubuntu-24.04
    # The CI-profile invariants (1000 runs, depth 50) take most of the time, so they run in three
    # parts side by side; part 1 also runs every other test. Part 3 takes whatever 1 and 2 leave.
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    env:
      GROUP_1: "invariant_[1-6]_"
      GROUP_2: "XR_(schedule|payment|held|purchase|openEmergency|lockOff)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/foundry
        with:
          version: ${{ steps.versions.outputs.FOUNDRY }}
      - name: Foundry build cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            contracts/out
            contracts/cache
          key: forge-ci-${{ hashFiles('contracts/src/**', 'contracts/test/**', 'contracts/script/**', 'contracts/foundry.toml', 'contracts/lib/**/*.sol') }}
      - name: Contract tests, part ${{ matrix.part }}
        working-directory: contracts
        env:
          FOUNDRY_PROFILE: ci
        run: |
          case "${{ matrix.part }}" in
            1) forge test --no-match-path 'test/invariant/*'
               forge test --match-path 'test/invariant/*' --match-test "$GROUP_1" ;;
            2) forge test --match-path 'test/invariant/*' --match-test "$GROUP_2" ;;
            3) forge test --match-path 'test/invariant/*' --no-match-test "$GROUP_1|$GROUP_2" ;;
          esac

  coverage-contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/foundry
        with:
          version: ${{ steps.versions.outputs.FOUNDRY }}
      - run: npm run coverage:contracts

  contracts-local-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/foundry
        with:
          version: ${{ steps.versions.outputs.FOUNDRY }}
      - run: |
          npm run chain:up > anvil.log 2>&1 &
          for i in $(seq 1 30); do cast block-number --rpc-url http://127.0.0.1:8545 >/dev/null 2>&1 && break; sleep 1; done
          npm run deploy:local
          contracts/script/check-wallets.sh 31337

  contract-analysis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/foundry
        with:
          version: ${{ steps.versions.outputs.FOUNDRY }}
      - run: |
          pip install "slither-analyzer==${{ steps.versions.outputs.SLITHER }}" "solc-select==${{ steps.versions.outputs.SOLC_SELECT }}"
          solc-select install 0.8.30 && solc-select use 0.8.30
          curl -sSfL "https://github.com/Cyfrin/aderyn/releases/download/aderyn-v${{ steps.versions.outputs.ADERYN }}/aderyn-x86_64-unknown-linux-gnu.tar.xz" | tar -xJ -C /tmp
          sudo install "$(find /tmp -maxdepth 2 -type f -name aderyn | head -1)" /usr/local/bin/aderyn
      - run: npm run analyze:contracts

  codeql:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    strategy:
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}

  semgrep:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - name: Semgrep
        run: |
          docker run --rm -v "$PWD:/src" -w /src "semgrep/semgrep@${{ steps.versions.outputs.SEMGREP_IMAGE_DIGEST }}" \
            semgrep scan --config p/default --config p/typescript --config p/react --config p/nextjs \
            --config p/secrets --config p/smart-contracts --severity ERROR --severity WARNING \
            --error --sarif --output semgrep.sarif
      - name: Drop results suppressed in source (nosemgrep), which GitHub would still open as alerts
        if: always()
        run: |
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))' semgrep.sarif > semgrep.filtered.sarif
          mv semgrep.filtered.sarif semgrep.sarif
      - if: always()
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  code-scanning-gate:
    needs: [codeql, semgrep]
    if: always()
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: read
    steps:
      - name: No open high, critical or medium alert on this ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          alerts=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/code-scanning/alerts?ref=${GITHUB_REF}&state=open" \
            --jq '[.[] | select((.rule.security_severity_level // "") as $s | ($s == "critical" or $s == "high" or $s == "medium") or ((.rule.security_severity_level == null) and (.rule.severity == "error" or .rule.severity == "warning")))] | length')
          echo "blocking alerts: $alerts"
          [ "$alerts" = "0" ]

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${{ steps.versions.outputs.GITLEAKS }}/gitleaks_${{ steps.versions.outputs.GITLEAKS }}_linux_x64.tar.gz" | tar -xz -C /tmp gitleaks
          /tmp/gitleaks git --log-opts="--all" --redact --no-banner --config .gitleaks.toml .

  deps:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - name: OSV-Scanner
        run: |
          curl -sSfL -o /tmp/osv-scanner "https://github.com/google/osv-scanner/releases/download/v${{ steps.versions.outputs.OSV_SCANNER }}/osv-scanner_linux_amd64"
          chmod +x /tmp/osv-scanner
          /tmp/osv-scanner scan --lockfile package-lock.json --format json > osv.json || true
          node scripts/check-osv.mjs osv.json
      - name: Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.DEPENDABOT_READ_TOKEN }}
        run: |
          [ -n "$GH_TOKEN" ] || { echo "DEPENDABOT_READ_TOKEN is not set" >&2; exit 1; }
          n=$(gh api "repos/${{ github.repository }}/dependabot/alerts?state=open&severity=high,critical" --jq length)
          echo "open high or critical Dependabot alerts: $n"
          [ "$n" = "0" ]
      - run: npm run check:deps

  test-indexer:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - name: pnpm (Envio v3 installs with pnpm during codegen, 16 S16-18)
        env:
          PNPM_VERSION: ${{ steps.versions.outputs.PNPM }}
        run: npm install -g "pnpm@$PNPM_VERSION"
      - name: Install, generate, check config, types and handler tests (16 S16-6, U1-U20)
        working-directory: indexer
        run: |
          pnpm install --frozen-lockfile
          pnpm codegen
          pnpm check
          pnpm typecheck
          pnpm test

  # 19 S19-17: Tier 1 and SEC1-SEC3 in both engines against the local stack (Anvil, stand-ins,
  # indexer in Docker, a production build). global-setup starts and stops all of it.
  e2e-tier1:
    name: e2e-tier1 (${{ matrix.engine }}, ${{ matrix.part }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Per engine, shards and the indexer-off case (F10) side by side (S19-17, decision 23);
    # each job starts its own local stack and scans its own server log (SEC3).
    strategy:
      fail-fast: false
      matrix:
        include:
          - { engine: chromium, part: 1, of: 4, workers: 6 }
          - { engine: chromium, part: 2, of: 4, workers: 6 }
          - { engine: chromium, part: 3, of: 4, workers: 6 }
          - { engine: chromium, part: 4, of: 4, workers: 6 }
          - { engine: chromium, part: indexer-off, of: 1, workers: 1 }
          - { engine: webkit, part: 1, of: 6, workers: 4 }
          - { engine: webkit, part: 2, of: 6, workers: 4 }
          - { engine: webkit, part: 3, of: 6, workers: 4 }
          - { engine: webkit, part: 4, of: 6, workers: 4 }
          - { engine: webkit, part: 5, of: 6, workers: 4 }
          - { engine: webkit, part: 6, of: 6, workers: 4 }
          - { engine: webkit, part: indexer-off, of: 1, workers: 1 }
    services:
      db:
        image: postgres:16@sha256:2d2b8998d31037bf721cfdf764d76ba74171b4fab3431b7f72c27c56ddbdf9e3
        env:
          POSTGRES_USER: amplop
          POSTGRES_PASSWORD: amplop
          POSTGRES_DB: amplop
        ports:
          - 5432:5432
        options: --health-cmd "pg_isready -U amplop -d amplop" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/foundry
        with:
          version: ${{ steps.versions.outputs.FOUNDRY }}
      - name: pnpm for the indexer
        env:
          PNPM_VERSION: ${{ steps.versions.outputs.PNPM }}
        run: npm install -g "pnpm@$PNPM_VERSION"
      - run: npm ci
      - run: npm run build -w @amplop/shared
      - run: cd indexer && pnpm install --frozen-lockfile
      - name: Database roles (05 S05-36)
        run: psql "postgres://amplop:amplop@127.0.0.1:5432/amplop" -v ON_ERROR_STOP=1 -v migrator_pw=amplop_migrator -v app_pw=amplop_app -f apps/web/drizzle/roles.sql
      # Once in a while the browser download takes most of half an hour; keep it between runs.
      - name: Playwright browser cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ matrix.engine }}-${{ hashFiles('package-lock.json') }}
      - run: npx -w @amplop/web playwright install --with-deps ${{ matrix.engine }}
      - run: |
          if [ "${{ matrix.part }}" = indexer-off ]; then
            npm run e2e:tier1:ci -- --project=indexer-off
          else
            npm run e2e:tier1:ci -- --project=${{ matrix.engine }}-phone --shard=${{ matrix.part }}/${{ matrix.of }}
          fi
        env:
          E2E_ENGINE: ${{ matrix.engine }}
          E2E_SPLIT: "1"
          E2E_WORKERS: ${{ matrix.workers }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.engine }}-${{ matrix.part }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7

  all-green:
    needs:
      - static
      - commits
      - test-ts
      - test-indexer
      - e2e-tier1
      - build
      - test-contracts
      - coverage-contracts
      - contracts-local-deploy
      - contract-analysis
      - codeql
      - semgrep
      - code-scanning-gate
      - secrets
      - deps
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Every gate succeeded
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          echo "$RESULTS"
          ! echo "$RESULTS" | grep -qE '"(failure|cancelled|skipped)"'

  # 02 S02-22: production deploys only from a green commit on main. Vercel builds remotely with its
  # own encrypted environment, so server keys never reach the runner. Migrations run first (05 S05-35).
  # Until the secrets exist the job says so and skips, so main stays green.
  deploy-production:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: all-green
    runs-on: ubuntu-24.04
    environment:
      name: production
      url: ${{ steps.web.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - id: versions
        run: grep -v "^#" tools/versions.env >> "$GITHUB_OUTPUT"
      - id: ready
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set yet; production deploy skipped."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.ready.outputs.go == 'true'
        run: npm ci
      - name: Migrations (05 S05-35)
        if: steps.ready.outputs.go == 'true'
        env:
          DATABASE_MIGRATION_URL: ${{ secrets.DATABASE_MIGRATION_URL }}
        run: npm run db:migrate
      - name: Deploy the app
        id: web
        if: steps.ready.outputs.go == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_WEB_PROJECT_ID }}
          VERCEL_VERSION: ${{ steps.versions.outputs.VERCEL }}
        run: echo "url=$(npx --yes "vercel@$VERCEL_VERSION" deploy --prod --yes --token "$VERCEL_TOKEN")" >> "$GITHUB_OUTPUT"
      - name: Deploy the docs
        if: steps.ready.outputs.go == 'true'
        env:
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_DOCS_PROJECT_ID }}
          VERCEL_VERSION: ${{ steps.versions.outputs.VERCEL }}
        run: npx --yes "vercel@$VERCEL_VERSION" deploy --prod --yes --token "$VERCEL_TOKEN"
