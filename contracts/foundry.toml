[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "prague"
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]
fs_permissions = [{ access = "read-write", path = "../deployments" }]

# fuzz.seed is passed by `npm run test:contracts` (--fuzz-seed), so the ci profile, which inherits
# from default, stays unseeded.
[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 50
fail_on_revert = false

[profile.ci]
[profile.ci.fuzz]
runs = 10000

[profile.ci.invariant]
runs = 1000
depth = 50
fail_on_revert = false

[profile.coverage]
[profile.coverage.fuzz]
runs = 256

[profile.coverage.invariant]
runs = 64
depth = 50
fail_on_revert = false

# forge lint covers src and script; test code is checked by the tests themselves.
[lint]
ignore = ["test/**/*.sol"]

[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"
quote_style = "double"
number_underscore = "thousands"
