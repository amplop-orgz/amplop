title = "amplop gitleaks config (S02-18)"

[extend]
useDefault = true

[[rules]]
id = "evm-private-key"
description = "EVM private key assigned to a secret-looking name"
regex = '''(?i)[A-Z0-9_]*(PRIVATE_KEY|PRIV|SECRET|MNEMONIC)[A-Z0-9_]*\s*[:=]\s*["']?(0x)?([a-fA-F0-9]{64})\b'''
secretGroup = 3

[[rules]]
id = "midtrans-server-key"
description = "Midtrans server key"
regex = '''(?:SB-)?Mid-server-[A-Za-z0-9_-]{8,}'''

[[allowlists]]
description = "Public Anvil test keys, the .env.example fake key, and design boards"
paths = ['''specs/design/''']
regexes = [
  # The ten well-known Anvil default private keys (public test data, local chain only).
